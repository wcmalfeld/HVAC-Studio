# Render Blueprint — HVAC Studio API + Postgres. The web app deploys to Vercel (see docs/deployment.md).
# Render dashboard → New → Blueprint → pick this repo. Pushes to main redeploy automatically.
#
# Plans: "free" costs nothing but the API sleeps after ~15 min idle (slow first request), uploads are lost
# on redeploy (no persistent disk), and the free database expires after 30 days. For real use switch the
# service to "starter", the database to "basic-256mb", and add the disk block below.
services:
  - type: web
    name: hvac-studio-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hvac-studio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    # Paid plans only — keeps uploaded drawings across deploys:
    # disk:
    #   name: uploads
    #   mountPath: /app/storage
    #   sizeGB: 1

databases:
  - name: hvac-studio-db
    plan: free
    region: oregon
    databaseName: hvac_studio
    user: hvac
    postgresMajorVersion: "16"

# Local development stack.
#   docker compose up -d db redis api          # backend only
#   docker compose --profile web up -d         # + Next.js web (optional)
#   docker compose exec api python scripts/seed_demo.py
name: hvac-studio

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hvac_studio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Not required yet (rate limiter is in-process); reserved for background jobs / shared rate limits.
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/hvac_studio
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: ["web"]  # optional
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_ORIGIN: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:

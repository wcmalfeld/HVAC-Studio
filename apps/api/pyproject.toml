[project]
name = "hvac-studio-api"
version = "0.1.0"
description = "HVAC Studio backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.200",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "pyjwt>=2.15,<3",
    "python-multipart>=0.0.33,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette.testclient nudges toward httpx2; httpx is the pinned, supported client for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"alembic/**" = ["E501"]
